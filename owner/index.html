function dashboardRange(){
  const now=new Date(),end=today();
  if(dashboardPeriod==='week'){
    const start=addDays(end,-6);
    return{start,end,labels:[...Array(7)].map((_,i)=>{const date=addDays(start,i);return new Date(date+'T12:00').toLocaleDateString(undefined,{weekday:'short'})})};
  }
  if(dashboardPeriod==='month'){
    const first=new Date(now.getFullYear(),now.getMonth(),1),lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    return{start:ymd(first),end,labels:[...Array(Math.ceil(lastDay/7))].map((_,i)=>`Week ${i+1}`)};
  }
  const quarterStart=Math.floor(now.getMonth()/3)*3,first=new Date(now.getFullYear(),quarterStart,1);
  return{start:ymd(first),end,labels:[0,1,2].map(i=>new Date(now.getFullYear(),quarterStart+i,1).toLocaleDateString(undefined,{month:'short'}))};
}
function rangeIndex(date,range){
  if(!date||date<range.start||date>range.end)return-1;
  if(dashboardPeriod==='week')return Math.round((new Date(date+'T12:00')-new Date(range.start+'T12:00'))/86400000);
  const value=new Date(date+'T12:00');
  if(dashboardPeriod==='month')return Math.floor((value.getDate()-1)/7);
  return value.getMonth()-new Date(range.start+'T12:00').getMonth();
}

  S.Sales.forEach(r=>add(r.customer,r.date));S.Orders.forEach(r=>add(r.customer,r.pickup||r.created));

async function saveSale(){const rc=Date.now().toString(36).toUpperCase().slice(-6),d=num($('#dc').value),rows=S.Items.filter(i=>cart[i.id]>0).map(i=>({date:saleDate,itemId:i.id,name:i.name,category:i.category,qty:cart[i.id],price:+(i.price*(1-d/100)).toFixed(2),cost:i.cost,customer:$('#cu').value.trim(),discount:d,receipt:rc}));

function splitOrderDetails(details){const marker='\n\nAdd-ons: ',index=String(details||'').indexOf(marker);return index<0?{description:String(details||''),addonText:''}:{description:String(details||'').slice(0,index),addonText:String(details||'').slice(index+marker.length)}}
function storedAddonRecords(details){const addonText=splitOrderDetails(details).addonText;if(!addonText)return[];return addonText.split(';').map(entry=>{const match=entry.trim().match(/^(.*) \[x(\d+) @(\d+(?:\.\d+)?)\]$/);return match?{name:match[1],qty:Number(match[2]),price:Number(match[3])}:null}).filter(Boolean)}
function storedAddonTotal(details){return sum(storedAddonRecords(details),record=>record.qty*record.price)}

async function saveOrder(){const previous=orderEd||{},status=$('#os').value,baseTotal=num($('#ot').value),total=baseTotal+selectedOrderAddonsTotal(),deposit=num($('#ox').value),costValue=$('#order-cost').value.trim(),description=$('#od').value.trim(),selectedAddons=S.Items.filter(item=>(item.category||'').toLowerCase()==='add-ons'&&(orderAddons[item.id]||0)>0),addonRecords=selectedAddons.map(item=>`${item.name} [x${orderAddons[item.id]} @${num(item.price)}]`),details=description+(addonRecords.length?'\n\nAdd-ons: '+addonRecords.join('; '):''),o={...previous,created:previous.created||today(),customer:$('#oc').value.trim(),phone:$('#op').value.trim(),details,pickup:$('#ok').value,total,deposit,cost:costValue===''?'':num(costValue),status,revenueDate:status==='Collected'?(previous.revenueDate||today()):''};
  if(!orderAddonsReviewed)return note('Review the add-ons and confirm whether there are any');if(selectedAddons.some(item=>!hasCost(item.price)||num(item.price)<=0))return note('Set a selling price for every selected add-on');if(baseTotal<=0)return note('Enter a base order price greater than zero');
  if(status==='Collected'&&!ordersFinanceReady)return note('Deploy the updated Apps Script before collecting orders');if(costValue!==''&&!ordersFinanceReady)return note('Deploy the updated Apps Script before saving order costs');if(status==='Collected'&&costValue==='')return note('Enter the estimated order cost before collecting');
  if(!o.customer||!description)return note('Add customer and order details');if(total<0||deposit<0||costValue!==''&&o.cost<0)return note('Prices and costs cannot be negative');const saved=await run('save','Orders',o);const index=S.Orders.findIndex(order=>order.id===saved.id);if(index>=0)S.Orders[index]=saved;else S.Orders.push(saved);orderEd=null;orderAddons={};orderAddonsReviewed=false;note(previous.id?'Order updated':'Order saved');render()}
async function saveExpense(){if(!expensesReady)return note('Deploy the updated Apps Script to enable expenses');const expense={date:$('#expense-date').value||today(),category:$('#expense-category').value,description:$('#expense-description').value.trim(),amount:num($('#expense-amount').value)};
  if(!expense.description)return note('Describe the expense');if(expense.amount<=0)return note('Enter an amount greater than zero');S.Expenses.push(await run('save','Expenses',expense));note('Expense saved');render()}
async function setStatus(id,status){const existing=S.Orders.find(order=>order.id===id);if(!existing)return;if(status==='Collected'&&!ordersFinanceReady){note('Deploy the updated Apps Script before collecting orders');render();return}if(status==='Collected'&&!hasOrderCost(existing)){note('Edit the order and enter its estimated cost first');render();return}const updated={...existing,status,revenueDate:status==='Collected'?(existing.revenueDate||today()):''};const saved=await run('save','Orders',updated);Object.assign(existing,saved);note(status==='Collected'?'Order collected; revenue updated':'Order status updated');render()}
function editOrder(id){orderEd=S.Orders.find(order=>order.id===id)||null;if(!orderEd)return;const records=storedAddonRecords(orderEd.details);orderAddons={};records.forEach(record=>{const item=S.Items.find(candidate=>candidate.category.toLowerCase()==='add-ons'&&candidate.name===record.name);if(item)orderAddons[item.id]=record.qty});orderAddonsReviewed=false;ed=null;view='orders';mobileNavOpen=false;render();scrollTo(0,0)}

async function refreshOwnerOrders(manual=false){
  try{
    const previous=S.Orders,previousIds=new Set(previous.map(order=>order.id)),latest=await run('getOrders');
    const incoming=latest.filter(order=>!previousIds.has(order.id)&&(order.status||'Pending')==='Pending');
    const changed=incoming.length>0||latest.length!==previous.length||latest.some(order=>{const old=previous.find(existing=>existing.id===order.id);return !old||old.status!==order.status||old.total!==order.total});
    S.Orders=latest;
    if(incoming.length)note(`${incoming.length} new customer order request${incoming.length===1?'':'s'}`);
    if(manual&&view==='orders'&&!orderEd||changed&&view==='home')render();
  }catch(error){console.error('Could not refresh customer orders:',error.message)}
}
